<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="Buscador Colegio Everest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="https://colegioeverest.github.io/BuscadorEverest/favicon.png">
    
    <!-- Fuente Outfit del diseño glassmorphism -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Buscador Colegio Everest</title>
    
    <style>
        :root {
            /* PALETA DE COLORES TEMA CLARO */
            --bg-primary: #f4f7f6; 
            --bg-secondary: #ffffff;
            --accent: #201E5B; /* Azul Colegio Everest */
            --accent-hover: #161440;
            --text-main: #1e293b; /* Texto oscuro */
            --text-muted: #64748b;
            --border: rgba(32, 30, 91, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.75); /* Vidrio esmerilado claro */
            --glass-border: rgba(255, 255, 255, 1);
            --shadow-premium: 0 8px 32px 0 rgba(32, 30, 91, 0.08);
            --card-shadow: 0 4px 20px 0 rgba(32, 30, 91, 0.05);
            --font: 'Outfit', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(32, 30, 91, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(32, 30, 91, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Se quitó el padding superior para que el header pegue arriba */
            padding: 0 0 2.5rem 0; 
            position: relative;
        }

        /* CAPA DE FONDO CON EL BOCETO DEL COLEGIO */
        .sketch-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://colegioeverest.github.io/BuscadorEverest/fondo-colegio-estilo-boceto-a-mano_alpha-bg.jpg'); 
            background-size: cover;
            background-position: center;
            filter: invert(1); 
            opacity: 0.06; 
            z-index: -1;
            pointer-events: none;
        }

        /* HEADER AZUL COMPLETO */
        .header {
            background-color: var(--accent);
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 3rem 1.5rem;
            margin-bottom: 3.5rem;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .logo-link {
            cursor: pointer;
            transition: transform 0.2s ease;
            display: block;
        }
        
        .logo-link:active {
            transform: scale(0.95);
        }

        .school-logo {
            max-height: 110px; 
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-buscador {
            font-size: 2.8rem; 
            font-weight: 700;
            color: #ffffff; /* Letras blancas sobre fondo azul */
            letter-spacing: -0.02em;
            line-height: 1;
            margin: 0;
        }

        .lupa-icon {
            height: 2.2rem;
            width: auto;
            /* Filtro para volver la lupa 100% blanca */
            filter: brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.2)); 
        }

        /* CONTENEDOR DE BÚSQUEDA */
        .search-container { 
            width: 100%; 
            max-width: 750px; 
            margin-bottom: 3.5rem; 
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 0 1.5rem; /* Padding lateral por si la pantalla es pequeña */
        }

        /* ========================================================
           ADAPTACIÓN DE ESTILOS PARA GOOGLE CSE (TEMA CLARO)
           ======================================================== */
        
        .gcsc-find-more-on-google, 
        .gcsc-find-more-on-google-magnifier, 
        .gcsc-find-more-on-google-branding, 
        .gcsc-more-maybe-branding-root, 
        .gsc-more-maybe-branding-root,
        .gsc-search-button-v2 svg title { 
            display: none !important; 
        }

        .gsc-control-cse { 
            background-color: transparent !important; 
            border: none !important; 
            padding: 0 !important;
            font-family: var(--font) !important;
        }

        /* Caja contenedora del input */
        .gsc-input-box {
            background: var(--glass-bg) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 18px !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            box-shadow: var(--shadow-premium) !important;
            transition: var(--transition) !important;
            padding: 2px 8px !important;
            display: flex !important;
            align-items: center !important;
        }

        /* Efecto Focus en la caja */
        .gsc-input-box-focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(32, 30, 91, 0.15), var(--shadow-premium) !important;
            background: #ffffff !important;
        }

        /* El input de texto real de Google */
        input.gsc-input {
            background: transparent !important;
            color: var(--text-main) !important;
            font-family: var(--font) !important;
            font-size: 1.15rem !important;
            padding: 10px !important;
        }

        input.gsc-input::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.8 !important;
            transition: color 0.2s ease !important;
        }

        input.gsc-input:focus::placeholder {
            color: transparent !important;
        }

        /* Botón de búsqueda de Google adaptado */
        .gsc-search-button-v2 {
            background-color: var(--accent) !important;
            border: none !important;
            border-radius: 16px !important;
            padding: 14px 28px !important;
            cursor: pointer !important;
            transition: var(--transition) !important;
            box-shadow: 0 4px 14px rgba(32, 30, 91, 0.2) !important;
            margin-left: 12px !important;
        }

        .gsc-search-button-v2:hover {
            background-color: var(--accent-hover) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(32, 30, 91, 0.3) !important;
        }

        .gsc-search-button-v2:active {
            transform: scale(0.98) !important;
        }

        .gsc-search-button-v2 svg {
            fill: white !important;
            width: 18px !important;
            height: 18px !important;
        }

        /* ESTILIZANDO EL CAJÓN DE RESULTADOS DE GOOGLE (OCULTO SI ESTÁ VACÍO) */
        
        /* Aseguramos que la base sea invisible */
        .gsc-results-wrapper-nooverlay {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin-top: 0 !important;
        }

        /* Sólo aplica estilos de caja cuando Google inyecta la clase 'visible' tras buscar */
        .gsc-results-wrapper-nooverlay.gsc-results-wrapper-visible {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 18px !important;
            padding: 20px !important;
            box-shadow: var(--shadow-premium) !important;
            margin-top: 25px !important;
        }

        /* Tarjetas individuales de cada resultado */
        .gsc-webResult.gsc-result {
            background: #ffffff !important;
            border-radius: 14px !important;
            padding: 18px !important;
            margin-bottom: 15px !important;
            border: 1px solid rgba(0,0,0,0.06) !important;
            box-shadow: var(--card-shadow) !important;
        }

        .gsc-webResult.gsc-result:hover {
            border-color: rgba(32, 30, 91, 0.15) !important;
        }

        .gsc-thumbnail-inside, .gsc-url-top {
            padding-bottom: 5px !important;
        }

        .gs-title, .gs-title * {
            color: var(--accent) !important;
            text-decoration: none !important;
            font-family: var(--font) !important;
            font-weight: 600 !important;
        }

        .gs-title:hover, .gs-title *:hover {
            text-decoration: underline !important;
        }

        /* ======================================================== */

        /* DASHBOARD (TARJETAS GLASSMORPHISM CLARO) */
        .dashboard-container {
            width: 100%;
            max-width: 850px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            z-index: 1;
            padding: 0 1.5rem;
        }

        .shortcut-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.8rem 1.2rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
        }

        .shortcut-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(32, 30, 91, 0.15);
            background: #ffffff;
            color: var(--accent);
        }

        .card-icon {
            width: 36px;
            height: auto;
            display: block;
            transition: var(--transition);
        }

        .shortcut-card:hover .card-icon {
            transform: scale(1.1) translateY(-2px);
        }

        /* FOOTER */
        .footer {
            margin-top: auto;
            padding-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
            text-align: center;
            z-index: 1;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header { gap: 1rem; margin-bottom: 2rem; flex-direction: column; padding: 2.5rem 1rem; }
            .title-wrapper { margin-top: -10px; }
            .title-buscador { font-size: 2.4rem; }
            .lupa-icon { height: 1.8rem; }
            .school-logo { max-height: 85px; }
            .dashboard-container { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            
            /* Ajustes móviles para Google CSE */
            form.gsc-search-box { display: flex; flex-direction: column; gap: 12px; }
            .gsc-search-button-v2 { margin-left: 0 !important; width: 100%; padding: 12px !important; }
            .gsc-results-wrapper-nooverlay.gsc-results-wrapper-visible { padding: 10px !important; }
        }
    </style>
</head>
<body>

    <!-- FONDO SKETCH TRANSPARENTE CON COLORES INVERTIDOS -->
    <div class="sketch-background"></div>

    <div class="header">
        <a href="#" onclick="window.location.reload(true); return false;" class="logo-link">
            <img src="https://colegioeverest.github.io/BuscadorEverest/colegioeverest.png" alt="Logo Colegio Everest" class="school-logo">
        </a>
        <div class="title-wrapper">
            <div class="title-buscador">Buscador</div>
            <img src="https://colegioeverest.github.io/BuscadorEverest/lupa.png" alt="Lupa" class="lupa-icon">
        </div>
    </div>

    <div class="search-container">
        <!-- INTEGRACIÓN DE GOOGLE CSE CON TARGET EN NUEVA PESTAÑA -->
        <script async src="https://cse.google.com/cse.js?cx=85af81c8695ad4f52"></script>
        <div class="gcse-search" data-linktarget="_blank"></div>
    </div>

    <div class="dashboard-container">
        
        <a href="https://www.colegioeverest.cl" target="_blank" class="shortcut-card">
            <img src="https://colegioeverest.github.io/BuscadorEverest/cards/everest.png" alt="Colegio Icono" class="card-icon">
            <span>Sitio web</span>
        </a>

        <a href="https://lirmi.com/cl/" target="_blank" class="shortcut-card">
            <img src="https://colegioeverest.github.io/BuscadorEverest/cards/lirmi.png" alt="Lirmi Icono" class="card-icon">
            <span>Lirmi Estudiantes</span>
        </a>

        <a style="display: none;" href="https://outlook.office.com/" target="_blank" class="shortcut-card">
            <img src="https://colegioeverest.github.io/BuscadorEverest/cards/outlook.png" alt="Outlook Icono" class="card-icon">
            <span>Outlook</span>
        </a>

        <a style="display: none;" href="https://onedrive.live.com/" target="_blank" class="shortcut-card">
            <img src="https://colegioeverest.github.io/BuscadorEverest/cards/onedrive.png" alt="OneDrive Icono" class="card-icon">
            <span>OneDrive</span>
        </a>

    </div>

    <div class="footer">
        Development by EVERTICS &bull; Powered by Google &bull; <a href="https://www.colegioeverest.cl" target="_blank">colegioeverest.cl</a>
    </div>

    <script>
        // Animación de escritura adaptada para inyectarse en el input de Google CSE una vez que cargue
        const words = ["Colegio Everest...", "Juntos Somos Everest..."];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let googleInput = null;

        // Intervalo para buscar la barra de Google, ya que se carga de forma asíncrona
        const checkInputInterval = setInterval(function() {
            googleInput = document.querySelector('input.gsc-input');
            if (googleInput) {
                clearInterval(checkInputInterval);
                type(); // Inicia la animación de escritura
            }
        }, 100);

        function type() {
            if (!googleInput) return;
            
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                charIndex--;
            } else {
                charIndex++;
            }

            // Actualiza el placeholder de Google agregando un pipe (|) para simular el cursor
            let text = currentWord.substring(0, charIndex);
            googleInput.setAttribute('placeholder', text + "|");

            let typeSpeed = isDeleting ? 40 : 80;

            if (!isDeleting && charIndex === currentWord.length) {
                typeSpeed = 1500; // Pausa antes de borrar
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                typeSpeed = 400; // Pausa antes de escribir la siguiente palabra
            }

            setTimeout(type, typeSpeed);
        }
        
        // Limpia hipervínculos rebeldes de Google que puedan desconfigurar el marco
        setInterval(function() {
            let escapeLinks = document.querySelectorAll('a[href*="google.com/search"]');
            escapeLinks.forEach(function(link) { 
                link.remove(); 
            });
        }, 1000);
    </script>

</body>
</html>
